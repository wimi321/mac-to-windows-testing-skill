version: 1
project:
  name: "Windows UI defect fixture"
  repository: "https://github.com/wimi321/mac-to-windows-testing-skill"
  windowsWorkspace: "%USERPROFILE%\\source\\repos\\mac-to-windows-testing-skill"
  artifact: "fixtures\\windows-ui-fixture\\FixtureApp.ps1"
commands:
  build: "powershell.exe -NoProfile -Command \"$ErrorActionPreference='Stop'; [void][System.Management.Automation.Language.Parser]::ParseFile('fixtures\\windows-ui-fixture\\FixtureApp.ps1',[ref]$null,[ref]$null)\""
  test: "powershell.exe -NoProfile -Command \"Write-Output fixture-ready\""
  launch: "powershell.exe -NoProfile -ExecutionPolicy Bypass -File fixtures\\windows-ui-fixture\\FixtureApp.ps1 -Mode defects"
automation:
  transport: "ssh"
  repairLimit: 3
  visualConfidenceThreshold: 0.85
  allowDestructiveActions: false
scenarios:
  - id: "clipped"
    title: "Detect intentionally clipped text"
    window:
      name: "Mac-to-Windows Fixture"
    steps:
      - action: "wait"
        seconds: 1
      - action: "screenshot"
        checkpoint: "clipped"
  - id: "overlap"
    title: "Detect overlapping buttons"
    window:
      name: "Mac-to-Windows Fixture"
    steps:
      - action: "assert"
        target:
          name: "Run validation"
        otherTarget:
          name: "Open evidence"
        condition: "noOverlap"
        checkpoint: "overlap"
  - id: "offscreen"
    title: "Detect controls outside the window"
    window:
      name: "Mac-to-Windows Fixture"
    steps:
      - action: "assert"
        target:
          name: "Export report"
        condition: "withinWindow"
        checkpoint: "offscreen"
  - id: "disabled"
    title: "Detect unexpectedly disabled actions"
    window:
      name: "Mac-to-Windows Fixture"
    steps:
      - action: "assert"
        target:
          name: "Continue test"
        condition: "enabled"
        checkpoint: "disabled"
  - id: "unresponsive"
    title: "Detect clicks without the declared response"
    window:
      name: "Mac-to-Windows Fixture"
    steps:
      - action: "click"
        target:
          name: "Update status"
        checkpoint: "unresponsive"
      - action: "assert"
        target:
          name: "Completed"
        condition: "textEquals"
        value: "Completed"
        checkpoint: "unresponsive-result"
  - id: "blank"
    title: "Detect an unexpectedly empty result region"
    window:
      name: "Mac-to-Windows Fixture"
    steps:
      - action: "assert"
        target:
          name: "Evidence summary is ready."
        condition: "exists"
        checkpoint: "blank"
  - id: "layout-audit"
    title: "Detect all deterministic geometry defects"
    window:
      name: "Mac-to-Windows Fixture"
    steps:
      - action: "audit"
        checkpoint: "defect-layout-audit"
        failOn:
          - "NONPOSITIVE_BOUNDS"
          - "OUTSIDE_WINDOW"
          - "ACTIONABLE_OVERLAP"
  - id: "safe-exploration"
    title: "Dangerous and unknown controls remain untouched during exploration"
    window:
      name: "Mac-to-Windows Fixture"
    steps:
      - action: "explore"
        checkpoint: "fixture-navigation"
        maxControls: 4
      - action: "screenshot"
        checkpoint: "after-safe-exploration"
