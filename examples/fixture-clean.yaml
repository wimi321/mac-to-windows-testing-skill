version: 1
project:
  name: "Windows UI clean fixture"
  repository: "https://github.com/wimi321/mac-to-windows-testing-skill"
  windowsWorkspace: "C:\\MacToWindowsTesting\\mac-to-windows-testing-skill"
  artifact: "fixtures\\windows-ui-fixture\\FixtureApp.ps1"
commands:
  build: "powershell.exe -NoProfile -Command \"$ErrorActionPreference='Stop'; [void][System.Management.Automation.Language.Parser]::ParseFile('fixtures\\windows-ui-fixture\\FixtureApp.ps1',[ref]$null,[ref]$null)\""
  test: "powershell.exe -NoProfile -Command \"Write-Output fixture-ready\""
  launch: "powershell.exe -NoProfile -ExecutionPolicy Bypass -File fixtures\\windows-ui-fixture\\FixtureApp.ps1 -Mode clean"
automation:
  transport: "ssh"
  repairLimit: 3
  visualConfidenceThreshold: 0.85
  allowDestructiveActions: false
scenarios:
  - id: "clean-window"
    title: "Clean fixture remains usable"
    window:
      name: "Mac-to-Windows Fixture"
    steps:
      - action: "wait"
        seconds: 1
      - action: "assert"
        target:
          name: "Run validation"
        otherTarget:
          name: "Open evidence"
        condition: "noOverlap"
      - action: "assert"
        target:
          name: "Export report"
        condition: "withinWindow"
      - action: "assert"
        target:
          name: "Continue test"
        condition: "enabled"
      - action: "click"
        target:
          name: "Update status"
      - action: "assert"
        target:
          name: "Completed"
        condition: "textEquals"
        value: "Completed"
      - action: "assert"
        target:
          name: "Evidence summary is ready."
        condition: "exists"
      - action: "screenshot"
        checkpoint: "clean"
      - action: "audit"
        checkpoint: "clean-layout-audit"
        failOn:
          - "NONPOSITIVE_BOUNDS"
          - "OUTSIDE_WINDOW"
          - "ACTIONABLE_OVERLAP"
  - id: "safe-exploration"
    title: "Safe exploration opens and closes a harmless settings window"
    window:
      name: "Mac-to-Windows Fixture"
    steps:
      - action: "explore"
        checkpoint: "fixture-navigation"
        maxControls: 4
        failOn:
          - "NONPOSITIVE_BOUNDS"
          - "OUTSIDE_WINDOW"
          - "ACTIONABLE_OVERLAP"
      - action: "screenshot"
        checkpoint: "after-safe-exploration"
