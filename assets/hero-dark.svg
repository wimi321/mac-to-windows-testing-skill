<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">Mac-to-Windows Testing Skill workflow, dark theme</title>
  <desc id="desc">A Mac AI controller sends a trusted test manifest to a real Windows runner and receives native evidence with a PASS, FAIL, or BLOCKED verdict.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#39414C" stroke-width="1" opacity=".4"/></pattern>
    <linearGradient id="wash" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#151A20"/><stop offset="1" stop-color="#172534"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1440" height="720" rx="32" fill="url(#wash)"/><rect width="1440" height="720" rx="32" fill="url(#grid)"/>
  <g font-family="ui-sans-serif,Segoe UI,Arial,sans-serif">
    <g transform="translate(72 62)">
      <rect width="166" height="32" rx="16" fill="#203A64" stroke="#416DAF"/><circle cx="18" cy="16" r="5" fill="#67A0FF"/>
      <text x="32" y="21" font-size="13" font-weight="700" letter-spacing="1.6" fill="#B8D1FF">PRECISION LAB</text>
      <text x="0" y="86" font-size="48" font-weight="760" fill="#F4F6F8">Test Windows from your Mac.</text><text x="0" y="138" font-size="48" font-weight="760" fill="#F4F6F8">Let AI close the loop.</text>
      <text x="2" y="180" font-size="18" fill="#ABB5C1">Build. Launch. Inspect native UI. Repair. Retest. Keep the evidence.</text>
    </g>
    <g transform="translate(72 292)" filter="url(#shadow)">
      <rect width="380" height="330" rx="22" fill="#20262E" stroke="#46515E"/><rect x="1" y="1" width="378" height="48" rx="21" fill="#2A313A"/>
      <circle cx="24" cy="25" r="5" fill="#F16B5B"/><circle cx="42" cy="25" r="5" fill="#E9B949"/><circle cx="60" cy="25" r="5" fill="#35A66F"/><text x="190" y="30" text-anchor="middle" font-size="13" font-weight="650" fill="#DCE3EB">MAC AI CONTROLLER</text>
      <text x="26" y="86" font-size="12" fill="#8E9AA8">TRUSTED PROJECT / MAIN</text><text x="26" y="119" font-size="14" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" fill="#EDF1F5">$ mac2win-test run --host win-lab</text><rect x="24" y="146" width="332" height="1" fill="#3D4652"/>
      <g font-size="14" fill="#D2D9E1"><circle cx="31" cy="178" r="7" fill="#25B977"/><path d="m27 178 3 3 6-7" fill="none" stroke="#fff" stroke-width="2"/><text x="50" y="183">Build packaged artifact</text><circle cx="31" cy="218" r="7" fill="#25B977"/><path d="m27 218 3 3 6-7" fill="none" stroke="#fff" stroke-width="2"/><text x="50" y="223">Trigger interactive runner</text><circle cx="31" cy="258" r="7" fill="#67A0FF"/><text x="50" y="263">Review native evidence</text></g>
      <rect x="24" y="286" width="112" height="26" rx="13" fill="#214735"/><text x="80" y="304" text-anchor="middle" font-size="12" font-weight="700" fill="#83E8B3">REPAIR LOOP 1/3</text>
    </g>
    <g transform="translate(512 386)"><path d="M0 48H188" stroke="#67A0FF" stroke-width="3" stroke-linecap="round"/><path d="m176 37 15 11-15 11" fill="none" stroke="#67A0FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="50" cy="48" r="7" fill="#17202A" stroke="#67A0FF" stroke-width="3"/><circle cx="100" cy="48" r="7" fill="#17202A" stroke="#67A0FF" stroke-width="3"/><circle cx="150" cy="48" r="7" fill="#17202A" stroke="#67A0FF" stroke-width="3"/><rect x="33" y="80" width="132" height="28" rx="14" fill="#20262E" stroke="#46515E"/><text x="99" y="99" text-anchor="middle" font-size="11" font-weight="700" fill="#B5BFCA">SSH / WINRM / UU</text></g>
    <g transform="translate(760 248)" filter="url(#shadow)">
      <rect width="608" height="398" rx="22" fill="#20242A" stroke="#4B5664"/><rect x="1" y="1" width="606" height="48" rx="21" fill="#2A3038"/><rect x="20" y="15" width="18" height="18" rx="3" fill="#4B86E8"/><path d="M29 15v18M20 24h18" stroke="#DCE8FF" stroke-width="1" opacity=".8"/><text x="52" y="31" font-size="13" font-weight="650" fill="#E8EDF3">REAL WINDOWS EVIDENCE</text>
      <rect x="24" y="70" width="360" height="236" rx="12" fill="#F7F8FA"/><rect x="40" y="88" width="328" height="28" rx="6" fill="#E9EDF2"/><circle cx="57" cy="102" r="5" fill="#2563EB"/><rect x="74" y="97" width="106" height="9" rx="4.5" fill="#9AA6B4"/><rect x="40" y="134" width="92" height="154" rx="8" fill="#EAF0F7"/><rect x="150" y="134" width="218" height="72" rx="8" fill="#FFFFFF" stroke="#D8DEE7"/><rect x="166" y="151" width="122" height="9" rx="4.5" fill="#4F5B69"/><rect x="166" y="171" width="174" height="7" rx="3.5" fill="#BCC5D0"/><rect x="150" y="220" width="102" height="68" rx="8" fill="#FFFFFF" stroke="#D8DEE7"/><rect x="266" y="220" width="102" height="68" rx="8" fill="#FFFFFF" stroke="#D8DEE7"/>
      <rect x="408" y="70" width="176" height="104" rx="12" fill="#2C343E" stroke="#46515F"/><text x="424" y="93" font-size="11" fill="#96A3B2">DETERMINISTIC</text><text x="424" y="121" font-size="30" font-weight="760" fill="#45D18A">PASS</text><text x="424" y="148" font-size="12" fill="#C2CBD5">12 checks / 0 missed</text>
      <rect x="408" y="188" width="176" height="118" rx="12" fill="#2C343E" stroke="#46515F"/><text x="424" y="212" font-size="11" fill="#96A3B2">AI VISUAL REVIEW</text><text x="424" y="244" font-size="25" font-weight="730" fill="#E8EDF3">0.97</text><text x="424" y="274" font-size="12" fill="#C2CBD5">Native PNG + UIA tree</text>
      <g transform="translate(24 328)"><rect width="126" height="36" rx="18" fill="#2B543F"/><circle cx="19" cy="18" r="5" fill="#45D18A"/><text x="33" y="23" font-size="12" font-weight="700" fill="#D9F8E7">UNLOCKED</text><rect x="138" width="116" height="36" rx="18" fill="#303B49"/><text x="196" y="23" text-anchor="middle" font-size="12" font-weight="650" fill="#DCE4ED">150% DPI</text><rect x="266" width="142" height="36" rx="18" fill="#303B49"/><text x="337" y="23" text-anchor="middle" font-size="12" font-weight="650" fill="#DCE4ED">NVIDIA GPU</text><rect x="420" width="164" height="36" rx="18" fill="#303B49"/><text x="502" y="23" text-anchor="middle" font-size="12" font-weight="650" fill="#DCE4ED">EVIDENCE SAVED</text></g>
    </g>
  </g>
</svg>
